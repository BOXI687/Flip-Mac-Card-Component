<!doctype html>
<!-- data-variant：版本代号（基础版留空）。它决定调过的参数存在哪一格，让不同版本互不影响；
     data-variant-label：页面顶部显示的版本名 -->
<html lang="zh-CN" data-variant="" data-variant-label="">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：让页面铺满刘海屏；user-scalable=no：禁止双指缩放打断手势 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- 「添加到主屏幕」后像 App 一样全屏打开 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peel">
  <meta name="theme-color" content="#8d8b6b">
  <!-- 这两个文件在 public/ 里，打包时原样复制 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <title>Peel Widget Stack</title>
</head>
<body>
  <!-- 整个页面由 React 画在这里（src/main.jsx → src/App.jsx） -->
  <div id="root"></div>
  <!-- type="module"：用 import / export 的新写法，所以不能再双击打开，要用 npm run dev 或打包后的网址 -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
