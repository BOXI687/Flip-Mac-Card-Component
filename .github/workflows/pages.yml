# 把三个分支一起发布成一个网站：
#   /     ← claude/github-cleanup-ux-prototype-541sop（主线，React + Vite：先打包，只发布打包结果 dist/）
#   /a/   ← version-a-opus（旧的纯 HTML 版本，原样发布）
#   /b/   ← version-b-emil（旧的纯 HTML 版本，原样发布）
#
# 任何一个分支有新提交都会重新发布。A/B 分支的提交先触发 variant-push.yml，
# 再由它唤起这里。这样发布总是从默认分支发起，符合 GitHub Pages 默认只允许默认分支发布的规则。
name: Deploy Pages

on:
  push:
    branches: [claude/github-cleanup-ux-prototype-541sop]
  workflow_run:
    workflows: [Variant pushed]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-cleanup-ux-prototype-541sop
          path: main

      # 主线是 React + Vite：装依赖（按 package-lock.json 装一模一样的版本），再打包成 dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build the main line (npm ci + vite build)
        working-directory: main
        run: |
          npm ci
          npm run build

      # 网站根目录 = 打包结果。源代码、测试、笔记都不发布
      - name: Put the build at the site root
        run: |
          mkdir site
          cp -R main/dist/. site/

      - name: Check out version branches (skipped if a branch does not exist yet)
        run: |
          for pair in "a:version-a-opus" "b:version-b-emil"; do
            dir="${pair%%:*}"; branch="${pair#*:}"
            if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$branch" >/dev/null; then
              git clone --depth 1 --branch "$branch" "https://github.com/${GITHUB_REPOSITORY}.git" "site/$dir"
            else
              echo "Branch $branch not found, skipping /$dir/"
            fi
          done

      # 给 /a/ 和 /b/ 的 CSS / JS 链接加上「?v=提交编号」。GitHub Pages 会让浏览器缓存文件 10 分钟，
      # 不加的话刚发布时可能出现「新页面 + 旧脚本」，按钮点了没反应。
      # 主线不用加：Vite 打包出来的文件名里自带内容指纹（index-Cutp3kcq.js），内容一变文件名就变
      - name: Add cache-busting version to CSS and JS links (/a/ and /b/ only)
        run: |
          for dir in site/a site/b; do
            [ -f "$dir/index.html" ] || continue
            v=$(git -C "$dir" rev-parse --short HEAD)
            sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+)\"#\1=\"\2?v=$v\"#g" "$dir/index.html"
            grep -oE '(js|css)/[^"]+\?v=[0-9a-f]+' "$dir/index.html"
          done

      - name: Remove repository metadata from the published site
        run: find site -name '.git' -prune -exec rm -rf {} + ; find site -path '*/.github' -prune -exec rm -rf {} +

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
